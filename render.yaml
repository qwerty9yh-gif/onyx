services:
  - type: web
    name: onyx-api
    runtime: node
    buildCommand: npm ci --include=dev && npx prisma db push --schema prisma/schema.prisma && npm run db:generate && npm run verify-schema --workspace=apps/api && npm run build:api
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://qwerty9yh-gif.github.io/onyx/
      - key: CORS_ORIGINS
        value: https://qwerty9yh-gif.github.io,http://localhost:5173
      - key: REDIS_URL
        sync: false
      - key: PRINTER_API_URL
        sync: false
      - key: SYNC_INTERVAL
        value: 30
      - key: HUBTEL_CLIENT_ID
        sync: false
      - key: HUBTEL_CLIENT_SECRET
        sync: false
      - key: HUBTEL_API_KEY
        sync: false
      - key: HUBTEL_SENDER_ID
        sync: false
      - key: HUBTEL_BASE_URL
        value: https://smsc.hubtel.com/v1
      - key: SMS_ENABLED
        value: "false"
      - key: DATABASE_RESET_ENABLED
        value: "false"
      - key: DATABASE_RESET_TOKEN
        sync: false
